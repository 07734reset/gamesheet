<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3d6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gamesheet Creator">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Gamesheet Creator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" class="no-print" aria-hidden="true">
  <div class="splash-ice"></div>
  <div class="splash-inner">
    <img src="logo.png" alt="" class="splash-logo" width="640" height="510">
    <div class="splash-title">Gamesheet <span>Creator</span></div>
    <div class="splash-puck"></div>
  </div>
</div>
<header class="topbar no-print">
  <div class="title" id="gameTitle">Gamesheet</div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main" class="no-print"></main>
<div id="printArea"></div>
<div id="toast" class="toast no-print" role="status" aria-live="polite"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
